<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — Giz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..900&family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --chalkboard:#22392C;
  --chalkboard-dark:#152219;
  --chalk:#F1EFE3;
  --chalk-dim:#C9D2C4;
  --paper:#FFFEF9;
  --paper-line:#C9D8EA;
  --margin-red:#C1432E;
  --pencil:#E2A233;
  --ink:#233A2C;
  --ink-blue:#2C4A6E;
  --ink-light:#5B7492;
  --border:#EAE5D6;
  --radius:10px;
  --shadow: 0 18px 40px -20px rgba(21,34,25,0.35);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--pencil);color:var(--chalkboard-dark);padding:10px 16px;border-radius:0 0 8px 0;font-weight:700;z-index:200;}
.skip-link:focus{left:0;}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation-duration:.001ms !important;transition-duration:.001ms !important;} }
a{color:inherit;} button{font-family:inherit;}
:focus-visible{outline:3px solid var(--pencil); outline-offset:2px;}
.display{font-family:'Fraunces',serif;} .hand{font-family:'Caveat',cursive;}
img{max-width:100%;}

/* ---- public nav ---- */
.nav{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:var(--chalkboard);color:var(--chalk);border-bottom:3px solid var(--chalkboard-dark);}
.nav-brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:1.35rem;text-decoration:none;color:var(--chalk);}
.nav-brand .dot{width:12px;height:12px;border-radius:50%;background:var(--pencil);display:inline-block;}
.nav-links{display:flex;gap:28px;font-size:.95rem;font-weight:500;align-items:center;}
.nav-links a{text-decoration:none;color:var(--chalk-dim);transition:color .15s;}
.nav-links a:hover{color:var(--chalk);}
.nav-cta{background:var(--pencil);color:var(--chalkboard-dark);padding:9px 18px;border-radius:999px;font-weight:700;font-size:.9rem;text-decoration:none;border:none;cursor:pointer;}
@media (max-width:760px){ .nav-links a:not(.nav-cta){display:none;} }

/* ---- hero ---- */
.hero{background:radial-gradient(ellipse at 20% -10%,rgba(255,255,255,.05),transparent 55%),radial-gradient(ellipse at 90% 110%,rgba(255,255,255,.04),transparent 50%),var(--chalkboard);color:var(--chalk);padding:88px 32px 110px;position:relative;overflow:hidden;}
.hero-inner{max-width:920px;margin:0 auto;text-align:center;position:relative;z-index:2;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);font-weight:600;margin-bottom:22px;}
.eyebrow::before,.eyebrow::after{content:"";width:24px;height:1px;background:var(--pencil);opacity:.6;}
.hero h1{font-size:clamp(2.2rem,5vw,4rem);line-height:1.08;margin:0 0 22px;font-weight:600;font-family:'Fraunces',serif;}
.hero h1 .underline{position:relative;white-space:nowrap;}
.hero h1 .underline svg{position:absolute;left:0;bottom:-10px;width:100%;height:14px;}
.hero p.lead{font-size:1.15rem;color:var(--chalk-dim);max-width:560px;margin:0 auto 36px;line-height:1.6;}
.hero-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.chalk-dust{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(241,239,227,.5) 1px,transparent 1px);background-size:34px 34px;opacity:.05;}
.margin-note{position:absolute;font-family:'Caveat',cursive;color:var(--pencil);font-size:1.3rem;line-height:1.2;opacity:.9;transform:rotate(-6deg);display:none;}
.margin-note.n1{top:70px;right:6%;display:block;}
@media (max-width:900px){ .margin-note{display:none !important;} }

/* ---- buttons ---- */
.btn-primary{background:var(--pencil);color:var(--chalkboard-dark);padding:14px 28px;border-radius:999px;font-weight:700;font-size:1rem;border:none;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .15s,box-shadow .15s;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 22px -8px rgba(226,162,51,.55);}
.btn-ghost{background:transparent;color:var(--chalk);padding:14px 26px;border-radius:999px;font-weight:600;font-size:1rem;border:1.5px solid rgba(241,239,227,.35);cursor:pointer;text-decoration:none;display:inline-block;transition:border-color .15s;}
.btn-ghost:hover{border-color:var(--chalk);}
.btn-generate{background:var(--margin-red);color:#fff;border:none;border-radius:999px;padding:15px 30px;font-weight:700;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:transform .15s,box-shadow .15s;}
.btn-generate:hover{transform:translateY(-2px);box-shadow:0 12px 24px -10px rgba(193,67,46,.5);}
.btn-generate:disabled{opacity:.6;cursor:progress;transform:none;}
.btn-small{background:#fff;border:1.5px solid #D8D2BE;color:var(--ink);padding:9px 16px;border-radius:999px;font-size:.86rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-small:hover{border-color:var(--ink-blue);}
.btn-small.active{background:var(--ink-blue);border-color:var(--ink-blue);color:#fff;}
.btn-danger-ghost{background:#fff;border:1.5px solid var(--margin-red);color:var(--margin-red);padding:9px 16px;border-radius:999px;font-size:.86rem;font-weight:600;cursor:pointer;}
.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;display:none;}
.spinner.on{display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---- strip ---- */
.strip{background:var(--chalkboard-dark);color:var(--chalk-dim);padding:22px 32px;text-align:center;font-size:.92rem;}
.strip strong{color:var(--chalk);}

/* ---- sections / landing ---- */
.section{max-width:1080px;margin:0 auto;padding:84px 32px;}
.section-head{max-width:640px;margin:0 auto 48px;text-align:center;}
.section-head .kicker{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--margin-red);font-weight:700;margin-bottom:10px;}
.section-head h2{font-family:'Fraunces',serif;font-size:clamp(1.8rem,3.4vw,2.5rem);margin:0 0 14px;font-weight:600;}
.section-head p{color:var(--ink-light);line-height:1.6;font-size:1.02rem;}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
@media (max-width:800px){.steps{grid-template-columns:1fr;}}
.step-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:26px 22px;position:relative;}
.step-card .num{font-family:'Fraunces',serif;font-size:2.1rem;color:var(--margin-red);font-weight:700;opacity:.85;}
.step-card h3{font-size:1.08rem;margin:10px 0 8px;font-family:'Fraunces',serif;font-weight:600;}
.step-card p{color:var(--ink-light);font-size:.94rem;line-height:1.55;margin:0;}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
@media (max-width:800px){.feature-grid{grid-template-columns:1fr;}}
.feature-card{padding:24px;border-radius:var(--radius);border:1px solid var(--border);}
.feature-card .icon{font-size:1.6rem;margin-bottom:10px;display:block;}
.feature-card h3{font-family:'Fraunces',serif;font-size:1.05rem;margin:0 0 6px;font-weight:600;}
.feature-card p{color:var(--ink-light);font-size:.92rem;margin:0;line-height:1.5;}
.cta-band{background:var(--chalkboard);color:var(--chalk);border-radius:16px;padding:56px 40px;text-align:center;max-width:1080px;margin:0 auto 90px;}
.cta-band h2{font-family:'Fraunces',serif;font-size:clamp(1.6rem,3vw,2.2rem);margin:0 0 14px;}
.cta-band p{color:var(--chalk-dim);max-width:480px;margin:0 auto 28px;line-height:1.6;}

footer.site-footer{background:var(--chalkboard-dark);color:var(--chalk-dim);padding:40px 32px;text-align:center;font-size:.85rem;}
footer.site-footer .hand{color:var(--pencil);font-size:1.4rem;}

/* ---- forms (shared) ---- */
.field{display:flex;flex-direction:column;gap:6px;}
.field.full{grid-column:1/-1;}
.field label{font-size:.82rem;font-weight:600;color:var(--ink-blue);letter-spacing:.01em;}
.field select,.field input[type="text"],.field input[type="email"],.field input[type="password"],.field input[type="number"],.field textarea{
  font-family:'Work Sans',sans-serif;border:1.5px solid #D8D2BE;background:#fff;border-radius:8px;padding:11px 12px;font-size:.96rem;color:var(--ink);width:100%;
}
.field textarea{resize:vertical;min-height:70px;}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--ink-blue);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px;}
@media (max-width:640px){.form-grid{grid-template-columns:1fr;}}
.chip-group{display:flex;flex-wrap:wrap;gap:10px;}
.chip{border:1.5px solid #D8D2BE;border-radius:999px;padding:8px 16px;font-size:.88rem;cursor:pointer;user-select:none;background:#fff;color:var(--ink);transition:all .12s;}
.chip input{display:none;}
.chip.checked{background:var(--ink-blue);border-color:var(--ink-blue);color:#fff;}
.form-actions{display:flex;align-items:center;gap:16px;margin-top:32px;flex-wrap:wrap;}
.form-hint{font-size:.85rem;color:var(--ink-light);}
.error-box{display:none;margin-top:20px;background:#FBEAE6;border:1px solid var(--margin-red);color:#7A2A1B;padding:14px 16px;border-radius:8px;font-size:.9rem;}
.error-box.show{display:block;}
.success-box{display:none;margin-top:20px;background:#EAF5EE;border:1px solid #2E6B47;color:#1E5236;padding:14px 16px;border-radius:8px;font-size:.9rem;}
.success-box.show{display:block;}

/* ---- notebook card (generator) ---- */
.notebook{
  background:linear-gradient(90deg,transparent 0 54px,var(--margin-red) 54px,var(--margin-red) 56px,transparent 56px),repeating-linear-gradient(var(--paper),var(--paper) 33px,var(--paper-line) 34px);
  background-color:var(--paper);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:44px 40px 44px 74px;
}
@media (max-width:640px){
  .notebook{padding:32px 24px 32px 50px;background:linear-gradient(90deg,transparent 0 30px,var(--margin-red) 30px,var(--margin-red) 32px,transparent 32px),repeating-linear-gradient(var(--paper),var(--paper) 33px,var(--paper-line) 34px);background-color:var(--paper);}
}
.notebook h2,.notebook h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.7rem;margin:0 0 6px;}
.notebook .sub{color:var(--ink-light);font-size:.95rem;margin:0 0 30px;}

/* ---- auth card (login/cadastro) ---- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--chalkboard);padding:32px;position:relative;overflow:hidden;}
.auth-card{
  position:relative;z-index:2;width:100%;max-width:440px;background:var(--paper);border-radius:16px;box-shadow:var(--shadow);
  padding:40px 36px;
  background:linear-gradient(90deg,transparent 0 34px,var(--margin-red) 34px,var(--margin-red) 36px,transparent 36px),repeating-linear-gradient(var(--paper),var(--paper) 33px,var(--paper-line) 34px);
  background-color:var(--paper);
  padding-left:58px;
}
.auth-brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:1.3rem;margin-bottom:22px;color:var(--ink);text-decoration:none;}
.auth-brand .dot{width:11px;height:11px;border-radius:50%;background:var(--pencil);display:inline-block;}
.auth-card h1{font-family:'Fraunces',serif;font-size:1.6rem;margin:0 0 8px;font-weight:600;}
.auth-card p.sub{color:var(--ink-light);font-size:.92rem;margin:0 0 26px;}
.auth-fields{display:flex;flex-direction:column;gap:18px;}
.auth-foot{margin-top:22px;text-align:center;font-size:.9rem;color:var(--ink-light);}
.auth-foot a{color:var(--ink-blue);font-weight:600;text-decoration:none;}
.auth-back{position:absolute;top:24px;left:28px;color:var(--chalk-dim);text-decoration:none;font-size:.9rem;z-index:3;}
.auth-back:hover{color:var(--chalk);}

/* ---- app shell (dashboard/gerador/biblioteca/perfil) ---- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:236px;flex-shrink:0;background:var(--chalkboard);color:var(--chalk);padding:26px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.sidebar .nav-brand{margin-bottom:30px;padding-left:6px;}
.sidebar nav{display:flex;flex-direction:column;gap:4px;flex:1;}
.sidebar nav a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:8px;color:var(--chalk-dim);text-decoration:none;font-weight:500;font-size:.94rem;}
.sidebar nav a .ic{font-size:1.05rem;width:20px;text-align:center;}
.sidebar nav a:hover{background:rgba(255,255,255,.06);color:var(--chalk);}
.sidebar nav a.active{background:rgba(226,162,51,.16);color:var(--pencil);font-weight:700;}
.sidebar .sidebar-foot{border-top:1px solid rgba(255,255,255,.12);padding-top:14px;margin-top:14px;}
.sidebar .sidebar-foot a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:var(--chalk-dim);text-decoration:none;font-size:.9rem;}
.sidebar .sidebar-foot a:hover{color:var(--chalk);}
@media (max-width:860px){
  .app-shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center;padding:14px 18px;gap:18px;overflow-x:auto;}
  .sidebar .nav-brand{margin-bottom:0;}
  .sidebar nav{flex-direction:row;flex:none;}
  .sidebar .sidebar-foot{border-top:none;margin-top:0;padding-top:0;}
}
.main{flex:1;min-width:0;background:var(--paper);}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:22px 36px;border-bottom:1px solid var(--border);gap:16px;flex-wrap:wrap;}
.topbar h1{font-family:'Fraunces',serif;font-size:1.5rem;margin:0;font-weight:600;}
.topbar .topbar-sub{color:var(--ink-light);font-size:.9rem;margin-top:4px;}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ink-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Fraunces',serif;flex-shrink:0;}
.content{padding:36px;max-width:1200px;}
@media (max-width:640px){ .content{padding:22px;} .topbar{padding:18px 22px;} }

/* ---- dashboard cards ---- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:36px;}
@media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:480px){.stat-grid{grid-template-columns:1fr;}}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.stat-card .stat-num{font-family:'Fraunces',serif;font-size:2rem;font-weight:700;color:var(--ink-blue);}
.stat-card .stat-label{font-size:.85rem;color:var(--ink-light);margin-top:4px;}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:24px;}
.panel h2{font-family:'Fraunces',serif;font-size:1.2rem;margin:0 0 4px;font-weight:600;}
.panel p.sub{color:var(--ink-light);font-size:.9rem;margin:0 0 20px;}
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:760px){.quick-actions{grid-template-columns:1fr;}}
.quick-action{display:block;border:1.5px dashed #D8D2BE;border-radius:10px;padding:20px;text-decoration:none;color:var(--ink);transition:border-color .15s,background .15s;}
.quick-action:hover{border-color:var(--pencil);background:#FCF6EA;border-style:solid;}
.quick-action .qa-ic{font-size:1.4rem;}
.quick-action h3{font-family:'Fraunces',serif;font-size:1rem;margin:8px 0 4px;font-weight:600;}
.quick-action p{margin:0;font-size:.86rem;color:var(--ink-light);}

/* recent list */
.recent-list{display:flex;flex-direction:column;}
.recent-item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.recent-item:last-child{border-bottom:none;}
.recent-item .ri-main{display:flex;gap:14px;align-items:flex-start;}
.recent-item .ri-ic{width:38px;height:38px;border-radius:9px;background:#F5F2E6;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;}
.recent-item h4{margin:0 0 3px;font-size:.96rem;font-weight:600;}
.recent-item .meta{font-size:.82rem;color:var(--ink-light);}
.tag{display:inline-block;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:#EAF0F6;color:var(--ink-blue);}
.tag.tag-red{background:#FBEAE6;color:var(--margin-red);}
.tag.tag-green{background:#EAF5EE;color:#2E6B47;}

/* library grid */
.lib-toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:24px;}
.lib-filters{display:flex;gap:10px;flex-wrap:wrap;}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;}
.lib-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:10px;}
.lib-card .lib-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.lib-card h3{font-family:'Fraunces',serif;font-size:1.02rem;margin:0;font-weight:600;}
.lib-card .meta{font-size:.82rem;color:var(--ink-light);}
.lib-card .lib-actions{display:flex;gap:8px;margin-top:auto;padding-top:6px;}
.search-input{border:1.5px solid #D8D2BE;border-radius:999px;padding:10px 16px;font-size:.92rem;min-width:220px;}
.search-input:focus{border-color:var(--ink-blue);}

/* ---- worksheet output (generator + library preview) ---- */
.worksheet-toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
.toolbar-btns{display:flex;gap:10px;flex-wrap:wrap;}
.worksheet{background:var(--paper);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:48px 52px;position:relative;}
@media (max-width:640px){.worksheet{padding:30px 22px;}}
.worksheet::before{content:"";position:absolute;top:0;left:44px;bottom:0;width:2px;background:var(--margin-red);opacity:.35;}
.ws-header{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:26px;}
.ws-header .ws-title{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;margin:0 0 14px;}
.ws-meta{display:flex;gap:28px;flex-wrap:wrap;font-size:.92rem;color:var(--ink-light);}
.ws-meta span b{color:var(--ink);border-bottom:1px dashed #B8B2A0;padding-bottom:2px;display:inline-block;min-width:120px;}
.ws-instructions{background:#F5F2E6;border-left:3px solid var(--pencil);padding:12px 16px;font-size:.92rem;color:var(--ink);margin-bottom:30px;line-height:1.55;}
.question{margin-bottom:28px;}
.question .q-head{display:flex;gap:10px;align-items:baseline;margin-bottom:10px;}
.question .q-num{font-family:'Fraunces',serif;font-weight:700;color:var(--margin-red);font-size:1.05rem;}
.question .q-text{font-size:1rem;line-height:1.6;}
.options{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;}
.options li{display:flex;gap:10px;align-items:center;font-size:.96rem;}
.options li .letter{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink-blue);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:var(--ink-blue);flex-shrink:0;}
.vf-row{display:flex;gap:22px;margin-top:8px;}
.vf-row label{display:flex;gap:6px;align-items:center;font-size:.94rem;}
.lines{margin-top:10px;}
.lines .line{border-bottom:1px solid var(--paper-line);height:26px;}
.answer{display:none;margin-top:8px;font-size:.88rem;color:#2E6B47;background:#EAF5EE;border-left:3px solid #2E6B47;padding:6px 12px;}
.answer.show{display:block;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(21,34,25,.55);z-index:100;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;}
.modal-overlay.show{display:flex;}
.modal-close{position:sticky;top:0;display:flex;justify-content:flex-end;max-width:820px;margin:0 auto;}
.modal-close button{background:#fff;border:1.5px solid var(--border);border-radius:999px;width:38px;height:38px;font-size:1.1rem;cursor:pointer;}
.modal-body{max-width:820px;margin:8px auto 40px;}

/* ---- correção ---- */
.grade-card{background:var(--chalkboard);color:var(--chalk);border-radius:14px;padding:34px;text-align:center;margin-bottom:24px;}
.grade-card .grade-num{font-family:'Fraunces',serif;font-size:3.2rem;font-weight:800;color:var(--pencil);line-height:1;}
.grade-card .grade-label{color:var(--chalk-dim);font-size:.92rem;margin-top:8px;}
.grade-card .grade-general{max-width:520px;margin:16px auto 0;color:var(--chalk-dim);font-size:.94rem;line-height:1.6;}
